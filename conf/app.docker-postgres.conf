# Revel build section
# This section contains values that are not reloadable
################################################################################

# Comma delimited list of folders that are included with the package, or build commands
# If you want to not include folders within these ones prefix the folder with a . to make it hidden
package.folders = conf, public, messages, mongodb_backup, app/views, frontend/dist
frontend.dist = frontend/dist


#------------------------
# gemsnote config
#------------------------
http.addr=0.0.0.0 # listen on all ip addresses
http.port=9000

site.url=http://localhost:9000 # or http://x.com:8080, http://www.xx.com:9000

# admin username
adminUsername=admin

# database type: mongodb or postgresql
db.type=postgresql

# PostgreSQL configuration (recommended, default)
db.host=postgres
db.port=5432
db.dbname=gemsnote
db.username=gemsnote
db.password=gemsnote
# PostgreSQL URL format (alternative to host/port configuration):
# db.url=postgresql://user:password@host:port/dbname?sslmode=disable
# db.url=postgresql://gemsnote:gemsnote@127.0.0.1:5432/gemsnote?sslmode=disable
# or parameter format:
# db.url=host=127.0.0.1 port=5432 user=gemsnote password=gemsnote dbname=gemsnote sslmode=disable

# MongoDB configuration (traditional deployment)
# To use MongoDB, change db.type to mongodb above and uncomment following:
# db.host=127.0.0.1
# db.port=27017
# db.dbname=gemsnote
# db.username=
# db.password=
# MongoDB URL format (alternative to host/port configuration):
# db.url=mongodb://myuser:mypass@localhost:40001,otherhost:40001/mydb
# db.url=mongodb://root:root123@localhost:27017/gemsnote
# db.urlEnv=${MONGODB_URL} # set url from env. eg. mongodb://root:root123@localhost:27017/gemsnote

# You Must Change It !! About Security!!
app.secret=V85ZzBeTnzpsHyjQX4zukbQ8qqtju9y2aDM55VWxAH9Qop19poekx3xkcDVvrD0y 

#--------------------------------
# revel config
# for dev
#--------------------------------
app.name=gemsnote
http.ssl=false
cookie.httponly=false
cookie.prefix=GEMSNOTE
cookie.domain= # for share cookie with sub-domain
cookie.secure=false
format.date=2006-01-02
format.datetime=2006-01-02 15:04:05 # 必须这样配置
results.chunked=false

log.trace.prefix = "TRACE "
log.info.prefix  = "INFO  "
log.warn.prefix  = "WARN  "
log.error.prefix = "ERROR "

# The default language of this application.
i18n.default_language=en-us

module.static=github.com/revel/modules/static

[dev]
mode.dev=true
results.pretty=true
watch=true

module.testrunner = # github.com/revel/modules/testrunner

log.trace.output = stderr
log.info.output  = stderr
log.warn.output  = stderr
log.error.output = stderr

[prod]
mode.dev=false
results.pretty=false
watch=false

module.testrunner =

log.trace.output = off
log.info.output  = off
log.warn.output  = %(app.name)s.log
log.error.output = %(app.name)s.log

