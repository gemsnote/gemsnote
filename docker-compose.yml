# Prebuilt release deployment; no Go, Node.js or local image build required.
services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: gemsnote
      POSTGRES_PASSWORD: ${GEMSNOTE_POSTGRES_PASSWORD:?Set GEMSNOTE_POSTGRES_PASSWORD in .env}
      POSTGRES_DB: gemsnote
    volumes:
      - ./data:/var/lib/postgresql
      - type: bind
        source: ./database/schema.sql
        target: /docker-entrypoint-initdb.d/001-gemsnote-schema.sql
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./database/seed.sql
        target: /docker-entrypoint-initdb.d/002-gemsnote-seed.sql
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gemsnote -d gemsnote"]
      interval: 5s
      timeout: 5s
      retries: 20

  gemsnote:
    environment:
      GEMSNOTE_MAIL_REDIS_URL: redis://redis:6379/0
    image: ghcr.io/gemsnote/gemsnote:${GEMSNOTE_VERSION:-1.0.0}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - 127.0.0.1:9000:9000
    volumes:
      - type: bind
        source: ./conf/app.docker-postgres.conf
        target: /opt/gemsnote/conf/app.conf
        read_only: true
        bind:
          create_host_path: false
      - ./files:/opt/gemsnote/files
      - ./public/upload:/opt/gemsnote/public/upload

  redis:
    image: redis:7-alpine
    profiles: [mail]
    restart: unless-stopped
    command: [redis-server, --appendonly, "yes"]
    volumes:
      - mail-redis-data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 10

  mail-worker:
    profiles: [mail]
    stop_grace_period: 45s
    entrypoint: ["/opt/gemsnote/docker-entry-mail-worker.sh"]
    image: ghcr.io/gemsnote/gemsnote:${GEMSNOTE_VERSION:-1.0.0}
    restart: unless-stopped
    environment:
      GEMSNOTE_MAIL_REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy

volumes:
  mail-redis-data:
