services:

  postgres:
    image: postgres:18-alpine
    container_name: postgres
    restart: always
    environment:
      POSTGRES_USER: gemsnote
      POSTGRES_PASSWORD: gemsnote
      POSTGRES_DB: gemsnote
    #ports:
    #  - 127.0.0.1:5432:5432
    volumes:
      # PostgreSQL 18 stores PGDATA under 18/docker in this parent directory.
      - ./data:/var/lib/postgresql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/001-gemsnote-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/002-gemsnote-seed.sql:ro

  gemsnote:
    environment:
      GEMSNOTE_MAIL_REDIS_URL: redis://redis:6379/0
    build: .
    image: gemsnote:1.0.0
    container_name: gemsnote
    restart: always
    depends_on:
      - postgres
    ports:
      - 127.0.0.1:9000:9000
    volumes:
      - type: bind
        source: ./conf/app.docker-postgres.conf
        target: /opt/gemsnote/conf/app.conf
        read_only: true
        bind:
          create_host_path: false
      - ./files:/opt/gemsnote/files
      - ./public/upload:/opt/gemsnote/public/upload

  redis:
    image: redis:7-alpine
    profiles: [mail]
    restart: unless-stopped
    command: [redis-server, --appendonly, "yes"]
    volumes:
      - mail-redis-data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 10

  gemsnote-worker:
    profiles: [mail]
    stop_grace_period: 45s
    entrypoint: ["/opt/gemsnote/docker-entry-gemsnote-worker.sh"]
    build: .
    image: gemsnote:1.0.0
    restart: unless-stopped
    environment:
      GEMSNOTE_MAIL_REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy

volumes:
  mail-redis-data:
